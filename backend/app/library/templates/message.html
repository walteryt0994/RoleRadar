{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>{{ message }}</p>
{% if links %}
<div class="actions">
  {% for href, text in links %}
  <a class="button secondary" href="{{ href }}">{{ text }}</a>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
