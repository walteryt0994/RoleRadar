[pytest]
# Same setting as backend/pytest.ini: block only LangSmith's auto-registered pytest plugin ("langsmith_plugin").
# pytest reads only the nearest config file and never merges them. Runs started inside backend/, or given paths
# under backend/, use backend/pytest.ini; runs started here without a backend/ path use this file. Keep both in sync.
addopts = -p no:langsmith_plugin
